name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it may publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same version as "packageManager" in package.json and the Dockerfile.
          bun-version: 1.3.11

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check (server + frontend)
        run: bun run typecheck

      - name: Build frontend
        run: bun run build:web

      # Coverage thresholds live in bunfig.toml and apply per file.
      - name: Test
        run: bun test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      # A ratchet, not a goal: duplication is ~0 % today and should stay low.
      - name: Duplicate check
        run: bunx jscpd@4 --min-lines 8 --min-tokens 60 --threshold 2 --silent src public/src

      # Reported, not yet blocking: watch it for a while before enforcing.
      - name: Dependency audit
        continue-on-error: true
        run: bun audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Catches a broken Dockerfile (e.g. a missing COPY) before release day.
      - name: Build image and check its health endpoint
        run: |
          docker build --build-arg BUILD_VERSION=ci -t ollama-manager:ci .
          docker run -d --name om -p 3100:3000 ollama-manager:ci
          ok=""
          for _ in $(seq 30); do
            if curl -fsS http://localhost:3100/health; then ok=1; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3100/ | grep -q "<title>Ollama Manager</title>"
          docker logs om
          docker rm -f om
          test -n "$ok"
