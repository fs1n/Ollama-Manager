services:
  ollama-manager:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: dev
    image: ollama-manager:dev
    container_name: ollama-manager-dev
    ports:
      - "3000:3000"
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      PORT: "3000"
      LITELLM_URL: "http://litellm:4000"
      LITELLM_KEY: "${LITELLM_MASTER_KEY:-sk-litellm-dev}"
      LITELLM_SYNC_INTERVAL: "30"
      # Ollaya next to Ollama, and the TypeSafe gateway LiteLLM uses to reach it
      OLLAYA_HOST: "http://ollaya:11435"
      OLLAYA_API_KEY: "${OLLAYA_API_KEY:-ollaya-dev}"
      OLLAYA_TYPESAFE_KEY: "${OLLAYA_TYPESAFE_KEY:-typesafe-dev}"
    env_file:
      - .env
    depends_on:
      litellm:
        condition: service_healthy
      ollaya:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"process.exit((await fetch('http://localhost:3000/health')).ok ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://llmproxy:llmproxy@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-litellm-dev}"
      OLLAMA_API_BASE: "http://host.docker.internal:11434"
      # Decision models through the manager's restricted gateway — never point
      # TYPESAFE_API_BASE at Ollaya directly: LiteLLM forwards every /typesafe/*
      # path, including Ollaya's management API.
      TYPESAFE_API_BASE: "http://ollama-manager:3000/api/typesafe"
      TYPESAFE_API_KEY: "${OLLAYA_TYPESAFE_KEY:-typesafe-dev}"
    env_file:
      - .env
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollaya:
    image: ghcr.io/ollaya-dev/ollaya
    container_name: ollaya-dev
    environment:
      OLLAYA_HOST: "0.0.0.0"
      OLLAYA_API_KEY: "${OLLAYA_API_KEY:-ollaya-dev}"
    ports:
      # Published for poking at it from the host; the manager uses the
      # compose network. Remove if the host network isn't trusted.
      - "11435:11435"
    volumes:
      - ollaya_models:/home/ollaya/.ollaya/models
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: llmproxy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    name: litellm_postgres_data
  ollaya_models:
    name: ollaya_dev_models
